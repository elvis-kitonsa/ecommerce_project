<!-- Shop Payment Success Template -->
<!-- This template displays a thank you message after a successful checkout. -->

{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Order Confirmed | Tech Store</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/all.min.css"
    />
    <style>
      .success-card {
        max-width: 600px;
        margin: 80px auto;
        border-radius: 20px;
      }
      .check-icon {
        font-size: 80px;
        color: #28a745;
      }
    </style>
  </head>
  <body class="bg-light">
    <div class="container text-center">
      <div class="card success-card shadow-lg border-0 p-5">
        <div class="card-body">
          <i class="fas fa-check-circle check-icon mb-4"></i>
          <h1 class="fw-bold mb-3">Thank You!</h1>
          <p class="lead text-muted mb-4">
            Your order request has been received. If you paid via
            <strong>Mobile Money</strong>, we are currently verifying the
            transaction.
          </p>
          <div class="alert alert-info py-3 mb-4">
            <i class="fas fa-info-circle me-2"></i> Verification usually takes
            <strong>5-10 minutes</strong>.
          </div>
          <p class="small text-muted mb-4">
            A confirmation will be sent once the process is complete.
          </p>
          <a
            href="{% url 'product_list' %}"
            class="btn btn-primary btn-lg rounded-pill px-5 fw-bold"
          >
            Back to Store
          </a>
        </div>
      </div>
    </div>
  </body>
</html>
